 h+=`<table><thead><tr><th>№</th><th id="sN">Оқушының аты-жөні</th><th>Статус</th><th>Қазіргі сұрақ</th><th id="sS">Балл</th><th>Дұрыс</th><th>Қате</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="row" data-u="${r.u}"><td data-l="№">${i+1}</td><td data-l="Аты-жөні"><b>${esc(r.name)}</b></td><td data-l="Статус">${r.status}</td><td data-l="Қазіргі сұрақ">${r.status==="Аяқтады"?"10/10":r.status==="Күтуде"?"—":r.qn+"/10 · "+(r.rem==null?"":Math.ceil(r.rem)+" с")}</td><td data-l="Балл">${r.score}</td><td data-l="Дұрыс">${r.c}</td><td data-l="Қате">${r.w+r.t}${r.t?` (уақыт: ${r.t})`:""}</td></tr>`).join("")||`<tr><td colspan="7">Әлі оқушы жоқ</td></tr>`}</tbody></table>`;
 if(S.open){const r=rows.find(x=>x.u===S.open);if(r)h+=`<div class="card"><div class="top"><h2>${esc(r.name)} — ${r.score}/10</h2><button class="btn sec" id="cl">Жабу</button></div><p>Дұрыс: ${r.c} · Қате: ${r.w} · Уақыты біткен: ${r.t} · Жауапсыз: ${10-r.n}</p><h2>Тақырыптық талдау</h2>${Object.keys(CATS).map(k=>{const x=r.cat[k]||{ok:0,t:0},p=x.t?Math.round(x.ok/x.t*100):null;return`<div class="cat ${p!==null&&p<50?"low":""}"><span>${CATS[k]}: ${x.ok}/${x.t}</span><b>${p===null?"—":p+"%"}${p!==null&&p<50?" · қайталау керек":p===100?" · жақсы":""}</b></div>`}).join("")}<h2>Сұрақтар бойынша</h2>${Q.map((q,i)=>{const a=r.A["q"+(i+1)],k=S.key["q"+(i+1)],ok=a&&a.choice===k;return`<div class="qi ${ok?"":"bad"}"><b>${i+1}.</b> ${q.q}<br>${a?(a.choice<0?`<span class="pill">Уақыт бітті — 0 балл</span>`:`Таңдауы: ${q.opts[a.choice]}`):`<span class="pill">Жауап берілмеген</span>`}<br>Дұрыс жауап: ${q.opts[k]}<br>${ok?"":`<small>Неліктен қате: ${q.why}</small>`}</div>`}).join("")}<div class="btns"><button class="btn dng" id="rm">Тіркеуді өшіру (қайта қосылуға рұқсат)</button></div></div>`}
 const keep=document.activeElement&&document.activeElement.id;app.innerHTML=h;
 $("out").onclick=async()=>{await signOut(auth);home()};
 $("nw").onclick=async()=>{const id="s"+Date.now();await set(ref(db,"sessions/"+id),{status:"lobby",createdAt:serverTimestamp()});await set(ref(db,"currentSession"),id)};
 $("st").onclick=()=>update(ref(db,"sessions/"+sid),{status:"running",startedAt:serverTimestamp()});
 $("en").onclick=async()=>{if(!confirm("Ойынды аяқтайсыз ба?"))return;await update(ref(db,"sessions/"+sid),{status:"finished",endedAt:serverTimestamp()});for(const r of rows){await set(ref(db,`results/${sid}/${r.u}`),{name:r.name,score:r.score,correct:r.c,wrong:r.w,timeout:r.t,answered:r.n});await set(ref(db,`analytics/${sid}/${r.u}`),r.cat)}};
 $("rs").onclick=()=>{S.res=true;render()};
 $("csv").onclick=()=>{const L=[["№","Аты-жөні","Статус","Балл","Дұрыс","Қате","Уақыты біткен",...Object.keys(CATS).map(k=>k+" %")]];rows.forEach((r,i)=>L.push([i+1,r.name,r.status,r.score,r.c,r.w,r.t,...Object.keys(CATS).map(k=>r.cat[k]?Math.round(r.cat[k].ok/r.cat[k].t*100):"")]));const b=new Blob(["\ufeff"+L.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sincos_nátijeler.csv";a.click()};
 $("sN").onclick=()=>{S.sort="name";render()};$("sS").onclick=()=>{S.sort="score";render()};
 document.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{S.open=tr.dataset.u;render()});
 if($("cl"))$("cl").onclick=()=>{S.open=null;render()};
 if($("rm"))$("rm").onclick=async()=>{if(!confirm("Оқушының барлық деректері өшіріледі. Жалғастыру?"))return;const u=S.open,nm=S.studs[u].name;S.open=null;await remove(ref(db,`answers/${sid}/${u}`));await remove(ref(db,`qStart/${sid}/${u}`));await remove(ref(db,`students/${sid}/${u}`));await remove(ref(db,`names/${sid}/${nk(nm)}`))}};
setTick(()=>{if(S.cur&&S.sess&&S.sess.status==="running")render()});
listen("answerKey",k=>{S.key=k||{};render()});
listen("currentSession",id=>{S.cur=id;unsubSid&&unsubSid();S.studs={};S.ans={};S.qs={};S.sess=null;if(!id){render();return}
 const subs=[["sessions/"+id,x=>S.sess=x],["students/"+id,x=>S.studs=x||{}],["answers/"+id,x=>S.ans=x||{}],["qStart/"+id,x=>S.qs=x||{}]].map(([p,f])=>onValue(ref(db,p),s=>{f(s.val());render()},fail));unsubSid=()=>subs.forEach(f=>f())});
render()}
const nk=n=>n.toLowerCase().replace(/\s+/g,"_").replace(/[^a-zа-яәіңғүұқөһё0-9_]/gi,"")||"x";
/* ---------- Оқушы ---------- */
async function student(){clear();app.className="";app.innerHTML="<p>Қосылуда…</p>";
 try{const u=auth.currentUser&&auth.currentUser.isAnonymous?auth.currentUser:(await signInAnonymously(auth)).user;run(u.uid)}catch(e){fail(e);app.insertAdjacentHTML("beforeend",`<button class="btn sec" id="bk">Артқа</button>`);$("bk").onclick=home}}
function run(uid){const S={sid:null,sess:null,me:null,ans:{},qs:{},key:{}},busy={};let fbIdx=null,view="";
 const save=()=>localStorage.getItem("sc_name")||"";
 const head=()=>`<div class="top"><b>👨‍🎓 ${esc(S.me?S.me.name:"")}</b><span id="tmw"></span></div>`;
 const loadKey=i=>{if(S.key["q"+i]!==undefined||busy["k"+i])return;busy["k"+i]=1;get(ref(db,"answerKey/q"+i)).then(s=>{S.key["q"+i]=s.val();busy["k"+i]=0;render()}).catch(()=>busy["k"+i]=0)};
 const render=()=>{
  if(!S.sid){app.innerHTML=`<div class="card center"><h2>Күтіңіз…</h2><p>Мұғалім сессияны ашқанша күтіңіз.</p></div>`;return}
  if(!S.me){const p=(save()||" ").split(" ");app.innerHTML=`<div class="card"><h2>Ойынға қосылу</h2><input id="fn" placeholder="Аты" value="${esc(p[0]||"")}"><input id="ln" placeholder="Тегі" value="${esc(p.slice(1).join(" "))}"><p class="err" id="e"></p><button class="btn" id="jn">Ойынға қосылу</button></div>`;$("jn").onclick=join;return}
  const st=S.sess&&S.sess.status;
  if(st==="lobby"){app.innerHTML=head()+`<div class="card center"><h2>Сәлем, ${esc(S.me.name)}!</h2><p>Мұғалім ойынды бастағанын күтіңіз…</p></div>`;return}
  let n=0;while(n<10&&S.ans["q"+(n+1)])n++;
  if((n>=10&&fbIdx===null)||(st==="finished"&&fbIdx===null)){result(n);return}
  const i=fbIdx!==null?fbIdx:n+1;
  if(!S.qs["q"+i]){if(!busy["s"+i]){busy["s"+i]=1;set(ref(db,`qStart/${S.sid}/${uid}/q${i}`),serverTimestamp()).catch(e=>{busy["s"+i]=0;fail(e)})}app.innerHTML=head()+`<p>Сұрақ ашылуда…</p>`;return}
  const a=S.ans["q"+i],qd=Q[i-1],order=perm(uid,i),k=S.key["q"+i];if(a)loadKey(i);
  const good=a&&k!==undefined&&a.choice===k;
  app.innerHTML=head()+`<div class="pips">${Q.map((_,j)=>{const x=S.ans["q"+(j+1)],c=x?(S.key["q"+(j+1)]===undefined?"now":x.choice===S.key["q"+(j+1)]?"ok":"bad"):j+1===i?"now":"";return`<span class="pip ${c}"></span>`}).join("")}<span class="count">${i} / 10</span></div>
  <section class="card"><div class="fig">${FIG}</div><p class="q">${qd.q}</p><div class="opts">${order.map((o,p)=>`<button class="opt ${a?(o===a.choice?(k===undefined?"":good?"ok":"bad"):o===k?"ok":"dim"):""}" ${a?"disabled":""} data-o="${o}"><span class="mk">${MARK[p]}</span><span>${qd.opts[o]}</span></button>`).join("")}</div>
  ${a&&k!==undefined?`<div class="fb ${good?"ok":"bad"}"><span class="head">${a.choice<0?"Уақыт бітті — 0 балл. Дұрыс жауабы:":good?"Дұрыс!":"Қате. Дұрыс жауабы:"}</span>${good?"":`<b>${qd.opts[k]}</b>`}<span>${qd.why}</span></div>`:""}
  ${a?`<button class="btn right" id="nx">${i===10?"Нәтижені көру":"Келесі сұрақ"}</button>`:""}</section>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(i,+b.dataset.o));
  if($("nx"))$("nx").onclick=()=>{fbIdx=null;render()};
  fbIdx=a?i:null;
  if(!a)fbIdx=null};
 const answer=(i,choice)=>{if(S.ans["q"+i]||busy["a"+i])return;busy["a"+i]=1;fbIdx=i;set(ref(db,`answers/${S.sid}/${uid}/q${i}`),{choice,at:serverTimestamp()}).catch(e=>{busy["a"+i]=0;fbIdx=null;fail(e)})};
 const tm=()=>{if(!S.sess||S.sess.status!=="running"||!S.me)return;let n=0;while(n<10&&S.ans["q"+(n+1)])n++;if(n>=10)return;const i=n+1,t=S.qs["q"+i];if(!t)return;const rem=60-(now()-t)/1000,el=$("tmw");if(el){el.className="timer"+(rem<=10?" low":"");el.textContent="⏱ "+Math.max(0,Math.ceil(rem))+" с"}if(rem<-0.3&&!busy["a"+i]){busy["a"+i]=1;fbIdx=i;set(ref(db,`answers/${S.sid}/${uid}/q${i}`),{choice:-1,at:serverTimestamp()}).catch(e=>{busy["a"+i]=0;setTimeout(()=>busy["a"+i]=0,1500)})}};
 const result=n=>{for(let i=1;i<=n;i++)loadKey(i);let c=0,w=0,t=0;const cat={};
  const rows=Q.map((q,j)=>{const a=S.ans["q"+(j+1)],k=S.key["q"+(j+1)];const ok=a&&a.choice>=0&&a.choice===k;cat[q.c]=cat[q.c]||{ok:0,t:0};if(a){cat[q.c].t++;if(ok){c++;cat[q.c].ok++}else if(a.choice<0)t++;else w++}return{q,a,k,ok}});
  app.innerHTML=head()+`<section class="card center"><p class="tag">Нәтиже</p><div class="score">${c}<small> / 10</small></div><p>Дұрыс: ${c} · Қате: ${w} · Уақыты біткен: ${t} · Жауапсыз: ${10-n}</p><div class="rev">${rows.map((r,j)=>`<span class="${!r.a?"na":r.ok?"ok":"bad"}">${j+1}</span>`).join("")}</div></section><div class="card"><h2>Қателерді талдау</h2>${rows.map((r,j)=>`<div class="fb ${r.ok?"ok":"bad"}"><b>${j+1}. ${r.q.q}</b><span>Таңдауың: ${!r.a?"жауап берілмеген":r.a.choice<0?"уақыт бітті (0 балл)":r.q.opts[r.a.choice]}</span>${r.k===undefined?"":`<span>Дұрыс жауап: <b>${r.q.opts[r.k]}</b></span>`}${r.ok?"":`<span>Неліктен қате: ${r.q.why}</span>`}</div>`).join("")}</div>`};
 const join=async()=>{const f=$("fn").value.trim(),l=$("ln").value.trim();if(!f||!l){$("e").textContent="Аты мен тегін енгізіңіз";return}
  const name=f+" "+l;$("jn").disabled=true;try{const kr=ref(db,`names/${S.sid}/${nk(name)}`),ex=(await get(kr)).val();if(ex&&ex!==uid){$("e").textContent="Бұл аты-жөні тіркелген. Мұғалімге хабарласыңыз.";$("jn").disabled=false;return}
   if(!ex)await set(kr,uid);await set(ref(db,`students/${S.sid}/${uid}`),{name,joinedAt:serverTimestamp()});localStorage.setItem("sc_name",name)}catch(e){fail(e);$("jn").disabled=false}};
 listen("currentSession",id=>{S.sid=id;S.me=null;S.sess=null;S.ans={};S.qs={};S.key={};fbIdx=null;
  if(!id){render();return}
  [["sessions/"+id,x=>S.sess=x],[`students/${id}/${uid}`,x=>S.me=x],[`answers/${id}/${uid}`,x=>S.ans=x||{}],[`qStart/${id}/${uid}`,x=>S.qs=x||{}]].forEach(([p,f])=>unsubs.push(onValue(ref(db,p),s=>{f(s.val());render()},fail)))});
 setTick(tm);render()}
home();
</script></body></html>
